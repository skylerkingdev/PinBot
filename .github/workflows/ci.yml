# Build and test pull requests and pushes. Windows, because the VPin agent is a Windows program; the server tests use
# the PostgreSQL that GitHub's Windows image ships (stopped by default; user postgres, password root).
# A push that makes a release skips this run: the release workflow runs exactly these checks first (workflow_call).
name: CI

on:
  push:
    branches: [master]
    paths-ignore: # the release workflow's paths (see release.yml): its own test job covers them
      - 'src/**'
      - 'deploy/**'
      - 'vendor/**'
      - 'publish.ps1'
      - 'tools/PinBot.Sign/**'
      - 'keys/update-signing.pub'
      - 'NOTICE.md'
      - 'docs/DEPLOY-NAS.md'
      - 'docs/DISCORD-SETUP.md'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_call: # the release workflow runs the same checks before it builds anything

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # the pinned memory maps are built into the agent
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          Get-Service -Name 'postgresql*' | Set-Service -StartupType Manual -PassThru | Start-Service
          "PINBOT_TEST_PG=Host=localhost;Username=postgres;Password=root;Database=postgres" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build PinBot.sln -c Release -warnaserror

      - name: Test
        run: dotnet test PinBot.sln -c Release --no-build
